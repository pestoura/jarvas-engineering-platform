name: reusable / repository security

on:
  workflow_call:
    inputs:
      dependency-severity:
        type: string
        required: false
        default: "CRITICAL,HIGH"
      sast-command:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  security:
    name: dependency / secret / sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: ${{ inputs.dependency-severity }}
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          format: table

      - name: Project SAST
        if: ${{ inputs.sast-command != '' }}
        shell: bash
        run: ${{ inputs.sast-command }}
