name: reusable / shell quality

on:
  workflow_call:
    inputs:
      syntax-command:
        type: string
        required: false
        default: "find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n"
      lint-command:
        type: string
        required: false
        default: "find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck"

permissions:
  contents: read

jobs:
  shell:
    name: shell syntax / lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        if: ${{ inputs.syntax-command != '' }}
        shell: bash
        run: ${{ inputs.syntax-command }}

      - name: ShellCheck
        if: ${{ inputs.lint-command != '' }}
        shell: bash
        run: ${{ inputs.lint-command }}
