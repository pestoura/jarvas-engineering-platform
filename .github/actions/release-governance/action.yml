name: JDS-002 release governance
description: Validate canonical ChangeRecord and ValidationCampaign files.
inputs:
  change-dir:
    description: Directory containing ChangeRecord YAML/JSON files.
    required: false
    default: changes
  campaign-dir:
    description: Directory containing ValidationCampaign YAML/JSON files.
    required: false
    default: validation
runs:
  using: composite
  steps:
    - name: Install validator dependencies
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check
        'PyYAML>=6,<7' 'jsonschema>=4.20,<5'
    - name: Validate JDS-002 records
      shell: bash
      run: |
        python "${{ github.action_path }}/../../../scripts/validate_release_governance.py" \
          --change-dir "${{ inputs.change-dir }}" \
          --campaign-dir "${{ inputs.campaign-dir }}" \
          --change-schema "${{ github.action_path }}/../../../schemas/change-record.schema.json" \
          --campaign-schema "${{ github.action_path }}/../../../schemas/validation-campaign.schema.json"
