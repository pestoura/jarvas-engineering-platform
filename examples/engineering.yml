apiVersion: engineering.jarvas/v1
kind: ProjectEngineeringProfile

metadata:
  name: example-project

spec:
  standard: JDS-1.0
  platformRef: 9ee1147ea85bbb5bbb733d252bab9ccbb113f5ef
  criticality: medium

  detection:
    enabled: true

  # Optional shortcut. Remove the preset entirely for direct capability composition.
  preset:
    name: python-service

  capabilities:
    add:
      - security.secret-scan
    remove: []

  delivery:
    releaseStrategy: versioned
    liveAcceptance: conditional
    requireEvidenceManifest: true

  execution:
    strategy: unspecified

  overrides: {}
