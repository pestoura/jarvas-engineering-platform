[project]
name = "jarvas-engineering-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
